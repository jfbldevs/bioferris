[package]
name = "bioferris"
description = "Rust-native bioinformatics, from sequences to workflows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
align.workspace = true
align-core.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde.workspace = true
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std", "force-soft"] }
crc32fast = "=1.5.0"
quick-xml = { version = "=0.41.0", default-features = false }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
